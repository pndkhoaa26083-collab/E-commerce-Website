<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập | Wang Fashion</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <!-- HEADER -->
    <header>
        <div class="container">
            <h1>Wang Fashion</h1>
            <p>Vẻ đẹp giao thoa văn hóa Á Đông</p>
        </div>
    </header>

    <!-- FORM ĐĂNG NHẬP -->
    <main class="login-container">

        <div class="login-box">

            <h2>ĐĂNG NHẬP</h2>

            <p>Chào mừng bạn quay trở lại Wang Fashion!</p>

            <form id="loginForm">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Nhập email của bạn" required>

                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" required>

                <p id="message" class="login-message"></p>

                <button type="submit" id="loginButton">
                    ĐĂNG NHẬP
                </button>

            </form>

            <div class="auth-divider"><span>hoặc</span></div>

            <button type="button" id="googleButton" class="google-btn">
                Tiếp tục với Google
            </button>

            <p class="register-link">
                Chưa có tài khoản?
                <a href="register.html">Đăng ký ngay</a>
            </p>

            <a href="index.html" class="back-home">
                ← Quay lại trang chủ
            </a>

        </div>

    </main>

    <script type="module" src="js/login.js"></script>

</body>

</html>
