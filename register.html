<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | Wang Fashion</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Wang Fashion</h1>
            <p>Vẻ đẹp giao thoa văn hóa Á Đông</p>
        </div>
    </header>

    <main class="container">
        <section
            style="max-width: 450px; margin: 50px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 2px 15px rgba(0,0,0,0.1);">

            <h2 style="text-align: center; margin-bottom: 10px;">
                TẠO TÀI KHOẢN
            </h2>

            <p style="text-align: center; margin-bottom: 25px;">
                Chào mừng bạn đến với Wang Fashion!
            </p>

            <form id="registerForm">

                <label for="fullname">Họ và tên</label>
                <input type="text" id="fullname" placeholder="Nhập họ và tên" required
                    style="width:100%; padding:12px; margin:10px 0 18px;">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Nhập email" required
                    style="width:100%; padding:12px; margin:10px 0 18px;">

                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" required minlength="6"
                    style="width:100%; padding:12px; margin:10px 0 18px;">

                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required
                    style="width:100%; padding:12px; margin:10px 0 18px;">

                <p id="message" role="alert" style="margin-bottom:15px; color:#c0392b;">
                </p>

                <button type="submit" id="registerButton"
                    style="width:100%; padding:13px; background:#222; color:white; border:none; cursor:pointer; border-radius:5px;">
                    ĐĂNG KÝ
                </button>

            </form>

            <p style="text-align:center; margin-top:20px;">
                Đã có tài khoản?
                <a href="login.html">Đăng nhập</a>
            </p>

            <p style="text-align:center; margin-top:15px;">
                <a href="index.html">← Quay lại trang chủ</a>
            </p>

        </section>
    </main>

    <script type="module" src="js/register.js"></script>
</body>

</html>
